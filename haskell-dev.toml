# What sets haskoin-node apart for haskell-dev, the development loop of
# https://github.com/jprupp/tools: `haskell-dev build`, `test` and `docs`.

# The spec modules that take most of the time of the tests. Each of their
# groups is run apart, so that the test processes share them evenly. Their
# groups can run at the same time: the scripted peers are in memory, a
# socket binds port 0, and a database is in a temporary folder of each
# process.
slow-specs = [
  "Haskoin.Node",
  "Haskoin.Node.Chain",
  "Haskoin.Node.Peer",
  "Haskoin.Node.PeerMgr",
  # two groups for each node implementation, each with pods of its own,
  # whose nodes it reaches through sockets of the pod
  "Haskoin.Node.Regtest",
]
