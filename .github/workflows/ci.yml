name: CI

# Built and tested twice with Stack, against the C libraries of Ubuntu and
# with Nix, with the Haddock documentation, by the shared workflow of
# jprupp/tools: .github/workflows/haskell-stack.yml there says more.
#
# The two jobs there skip the regtest tests (Haskoin.Node.RegtestSpec, in the
# spec suite), which the regtest job here runs: they start Bitcoin Core and
# Bitcoin Cash Node in Podman, which takes longer and needs to download the
# node binaries.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  stack:
    uses: jprupp/tools/.github/workflows/haskell-stack.yml@master
    with:
      apt-packages: librocksdb-dev libsecp256k1-dev pkg-config zlib1g-dev
      env: HASKOIN_NODE_SKIP_REGTEST=1

  regtest:
    name: Regtest against Bitcoin Core and Bitcoin Cash Node
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: scripts/install-system-libraries.sh podman

      - name: Set up Stack
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: latest
          stack-no-global: true

      - name: Cache Stack
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            .stack-work
          key: stack-os-${{ runner.os }}-${{ hashFiles('stack.yaml', 'stack.yaml.lock', '**/package.yaml') }}
          restore-keys: stack-os-${{ runner.os }}-

      # The tests build the image from test/regtest/Containerfile, which
      # downloads the official binaries and checks their hashes.
      - name: Run the regtest tests
        run: stack --no-nix test --install-ghc haskoin-node:spec --ta '--match /Haskoin.Node.Regtest/'
