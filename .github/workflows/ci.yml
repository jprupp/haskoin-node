name: CI

# Every change is built and tested twice with Stack:
#
# - os-libraries: against the C libraries that Ubuntu packages, as most users
#   build it, with --no-nix;
# - nix: with --nix, so that GHC and the C libraries listed under "nix:" in
#   stack.yaml come from nixpkgs, as on NixOS or with "stack --nix" locally.
#
# Both jobs also build the Haddock documentation, so broken markup fails CI.
# They skip the regtest suite, which the regtest job runs: it starts Bitcoin
# Core and Bitcoin Cash Node in Podman, which takes longer and needs to
# download the node binaries.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  os-libraries:
    name: Stack with OS libraries
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Only this repository is checked out, so extra-deps that point at
      # sibling checkouts (such as ../haskoin-core) cannot build here.
      - name: Reject local path dependencies
        run: |
          if grep -nE '^[[:space:]]*-[[:space:]]*(\.\.?/|/|~)' stack.yaml; then
            echo "::error file=stack.yaml::stack.yaml refers to local paths outside the repository. Pin released versions (or a git commit) in extra-deps before pushing."
            exit 1
          fi

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y librocksdb-dev libsecp256k1-dev pkg-config zlib1g-dev

      - name: Set up Stack
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: latest
          stack-no-global: true

      - name: Cache Stack
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            .stack-work
          key: stack-os-${{ runner.os }}-${{ hashFiles('stack.yaml', 'stack.yaml.lock', '**/package.yaml') }}
          restore-keys: stack-os-${{ runner.os }}-

      - name: Build, test and build the documentation
        env:
          HASKOIN_NODE_SKIP_REGTEST: "1"
        run: stack --no-nix build --install-ghc --test --haddock --no-haddock-deps

  nix:
    name: Stack with Nix
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Only this repository is checked out, so extra-deps that point at
      # sibling checkouts (such as ../haskoin-core) cannot build here.
      - name: Reject local path dependencies
        run: |
          if grep -nE '^[[:space:]]*-[[:space:]]*(\.\.?/|/|~)' stack.yaml; then
            echo "::error file=stack.yaml::stack.yaml refers to local paths outside the repository. Pin released versions (or a git commit) in extra-deps before pushing."
            exit 1
          fi

      # Stack runs the build inside nix-shell, which takes GHC and the
      # libraries from <nixpkgs>; nix_path points that at nixos-unstable.
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Set up Stack
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: latest
          stack-no-global: true

      - name: Cache Stack
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            .stack-work
          key: stack-nix-${{ runner.os }}-${{ hashFiles('stack.yaml', 'stack.yaml.lock', '**/package.yaml') }}
          restore-keys: stack-nix-${{ runner.os }}-

      - name: Build, test and build the documentation
        env:
          HASKOIN_NODE_SKIP_REGTEST: "1"
        run: stack --nix build --test --haddock --no-haddock-deps

  regtest:
    name: Regtest against Bitcoin Core and Bitcoin Cash Node
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y librocksdb-dev libsecp256k1-dev pkg-config zlib1g-dev podman

      - name: Set up Stack
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: latest
          stack-no-global: true

      - name: Cache Stack
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            .stack-work
          key: stack-os-${{ runner.os }}-${{ hashFiles('stack.yaml', 'stack.yaml.lock', '**/package.yaml') }}
          restore-keys: stack-os-${{ runner.os }}-

      # The suite builds the image from test/regtest/Containerfile, which
      # downloads the official binaries and checks their hashes.
      - name: Run the regtest suite
        run: stack --no-nix test --install-ghc haskoin-node:regtest
